<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#082B60" />
    <meta
      name="description"
      content="Abdulrahman Afify — Senior Mobile Engineer. React Native, React, TypeScript. 9+ years building high-performance apps scaled to 2M+ users."
    />
    <title>Abdulrahman Afify — Senior Mobile Engineer</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: A daylight hiring page whose first read is the blazer: sampled navy fields, not Inter, not gradient type, not a costume theme.
      OWN-WORLD: Blazer navy #082B60 owns nav, hero, and close. Warm paper from the headshot room. Night dims that paper and lights the jacket (#1B4F9C). Bricolage Grotesque variable. Portrait is a flush window cut in the field. 4px controls. Motion is that window opening, not a fade-up of every section.
      STORY: A recruiter sees the person and the scale in one viewport, then books a call.
      FIRST VIEWPORT: Navy mast, content-sized. Portrait is a window in the field: full-bleed on mobile, right-edge column from md stretching to the type. Name ~2.2–3.5rem. Two invert actions. No eyebrow.
      FORM: Committed blazer-navy, user-pinned “not old / check colors”, seed n/a (brief-pinned over the previous airport roll).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
